services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: manar_qc
      POSTGRES_USER: manar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manar"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.qcg.rule=Host(`qcg.manar.pk`)
      - traefik.http.routers.qcg.entrypoints=websecure
      - traefik.http.routers.qcg.tls.certresolver=le
      - traefik.http.services.qcg.loadbalancer.server.port=8000
      # Staging
      - traefik.http.routers.qcg-staging.rule=Host(`staging.qcg.manar.pk`)
      - traefik.http.routers.qcg-staging.entrypoints=websecure
      - traefik.http.routers.qcg-staging.tls.certresolver=le
      - traefik.http.routers.qcg-staging.service=qcg

networks:
  proxy: {name: "manar-stack_default", external: true}   # existing traefik network
  internal: {}

volumes: {pgdata: {}}
