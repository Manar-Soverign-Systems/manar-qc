<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MANAR QC — Bundle Ticket {{ b.bundle_code }}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #fff; color: #000; }
    .ticket-box { width: 300px; border: 2px solid #000; padding: 16px; text-align: center; margin: 0 auto; }
    .qr-img { width: 180px; height: 180px; margin: 12px 0; }
    .field { font-size: 14px; margin: 4px 0; text-align: left; }
    .btn-print { margin-top: 16px; padding: 8px 16px; background: #000; color: #fff; border: none; cursor: pointer; }
    @media print { .btn-print { display: none; } }
  </style>
</head>
<body>
  <div class="ticket-box">
    <div style="font-weight: bold; font-size: 18px;">MANAR QC BUNDLE TICKET</div>
    <img src="data:image/png;base64,{{ img }}" class="qr-img" alt="QR Code">
    <div class="field"><strong>Bundle Code:</strong> {{ b.bundle_code }}</div>
    <div class="field"><strong>PO Number:</strong> {{ b.lay.workorder.po_number }}</div>
    <div class="field"><strong>Lay #:</strong> {{ b.lay.lay_number }}</div>
    <div class="field"><strong>Size:</strong> {{ b.size_label }} | <strong>Qty:</strong> {{ b.qty }}</div>
    <div style="font-size: 10px; color: #555; word-break: break-all; margin-top: 8px;">{{ payload }}</div>
    <button class="btn-print" onclick="window.print()">Print Ticket</button>
  </div>
</body>
</html>
