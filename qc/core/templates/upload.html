{% extends "base.html" %}
{% block c %}
<h2>Sync Upload (Opt-in Station Aggregates)</h2>

<div style="background-color: var(--panel-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 6px; max-width: 500px;">
  <p style="color: var(--text-muted); font-size: 0.9rem;">
    Upload the exported station batch ZIP file containing summary aggregates and hash chains.
  </p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div style="margin-bottom: 20px;">
      <input type="file" name="zip" accept=".zip" required>
    </div>
    <button class="btn btn-success">Upload & Register Aggregates</button>
  </form>
</div>
{% endblock %}
