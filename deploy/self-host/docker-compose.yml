services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manar"]
      interval: 5s
      retries: 10

  web:
    build: ../..
    env_file: .env
    environment:
      SELF_HOST_VENDOR: "${VENDOR_CODE}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
