http:
  middlewares:
    sec-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
    rate-login:
      rateLimit: {average: 10, period: 1m, burst: 5}
    admin-allowlist:
      ipWhiteList: {sourceRange: ["127.0.0.1/32"]}
